app = '2mrrw-hls-transcoder'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[env]
  LOG_LEVEL    = "info"
  IDLE_POLL_MS = "5000"

# A second "video" process group is deliberately NOT declared here yet.
# Fly.io does not treat a newly-declared process group as a dormant
# placeholder — it attempts to provision (and bill for) a real machine for
# it on the next deploy, confirmed the hard way: adding one here triggered
# an immediate machine-launch attempt before any video work existed to run.
# The video lane gets added only once real VIDEO_TRANSCODE work is ready to
# benchmark, using an explicit per-lane worker entry point (not a shared
# command branching on an env var) so audio/video process identity is
# structurally unambiguous, not just convention. Until then, this app stays
# single-process — index.js already resolves its own lane defensively via
# FLY_PROCESS_GROUP/WORKER_JOB_TYPE, defaulting to "audio", so nothing here
# depends on that decision landing first.
[[vm]]
  memory   = '2gb'
  cpu_kind = 'shared'
  cpus     = 2
