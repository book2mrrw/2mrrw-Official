app = '2mrrw-hls-transcoder'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[env]
  LOG_LEVEL    = "info"
  IDLE_POLL_MS = "5000"

# Two physically separate scheduling lanes so a long video encode can never
# occupy the audio worker's claim slot (and vice versa). "app" is kept as
# the audio lane's process-group name unchanged — it's exactly what the
# already-running production machines are tagged as, so this never requires
# reassigning a live machine. Each lane runs its own explicit entry-point
# file (not one shared command branching on an env var), so process
# identity is structurally unambiguous rather than convention-based —
# audio-worker.js never imports the video processor and video-worker.js
# never imports transcoder.js.
[processes]
  app   = "node src/workers/audio-worker.js"
  video = "node src/workers/video-worker.js"

[[vm]]
  processes = ["app"]
  memory   = '2gb'
  cpu_kind = 'shared'
  cpus     = 2

# Initial production baseline for the video lane — not a final tuned size.
# 8gb is the minimum Fly.io allows for the 'performance' CPU kind (a 4gb
# config was rejected outright: "invalid config.guest.memory_mb, minimum
# required 8192 MiB"). This will be resized once real VIDEO_TRANSCODE
# workloads produce actual CPU/RAM/duration data to size against.
[[vm]]
  processes = ["video"]
  memory   = '8gb'
  cpu_kind = 'performance'
  cpus     = 4

# Dedicated scratch storage for the video lane only — the audio lane never
# mounts this and needs no change for it. The video machine's default
# ephemeral root disk (~7.8gb) cannot hold a realistic 4K/HDR master plus
# simultaneous AVC+AV1 rendition candidates plus VMAF/CAMBI reference
# decoding plus CMAF packaging output — confirmed on the live machine
# (`df -h /` showed 7.4gb available). 500gb is scratch/workspace capacity,
# not canonical storage: masters, published HLS/CMAF, Peek, posters, and
# thumbnails all remain durable in R2, exactly as before. Each video
# machine gets its own volume (never a shared filesystem across machines —
# Fly volumes are host-local), matching one volume per machine below.
# Scheduled snapshots are disabled on both — this is disposable transcode
# scratch, not data needing backup; nothing here is canonical.
[mounts]
  source      = "video_scratch"
  destination = "/data"
  processes   = ["video"]
